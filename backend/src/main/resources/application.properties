spring.application.name=dealership
server.port=8080

# ----- Banco H2 em memoria -----
spring.datasource.url=jdbc:h2:mem:ford;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2 em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ----- JPA / Hibernate -----
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ----- JWT -----
# Segredo HS256 (>= 32 caracteres). Em producao, mover para variavel de ambiente.
app.jwt.secret=ford-dealership-super-secret-key-change-me-please-2026
# Expiracao do token em milissegundos (24h)
app.jwt.expiration=86400000
